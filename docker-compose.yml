services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 3000
      PGHOST: postgres
    ports:
      - "${APP_PORT:-3001}:3000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pixo}
      POSTGRES_USER: ${POSTGRES_USER:-pixo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-troque_essa_senha_forte}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pixo} -d ${POSTGRES_DB:-pixo}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
